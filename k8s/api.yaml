apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: agentfastapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: agentfastapi-api:local
          imagePullPolicy: Never
          command:
            - uvicorn
            - app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --ssl-certfile
            - /app/certs-tls/tls.crt
            - --ssl-keyfile
            - /app/certs-tls/tls.key
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: agentfastapi-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentfastapi-postgres
                  key: DATABASE_URL
            - name: REDIS_URL
              value: redis://redis:6379/0
          volumeMounts:
            - name: tls
              mountPath: /app/certs-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/hello
              port: 8000
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/hello
              port: 8000
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: tls
          secret:
            secretName: agentfastapi-tls
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: agentfastapi
spec:
  type: LoadBalancer
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
