# Celery worker and beat: the same image as the api (one image, different command).
# Google credentials come from Workload Identity (dev/staging) or the local overlay's ADC secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: agentfastapi-app
          command: [celery, -A, app.workers.celery_app, worker, --pool=threads, --concurrency=4, --loglevel=INFO]
          envFrom:
            - secretRef:
                name: agentfastapi-secrets
            - configMapRef:
                name: agentfastapi-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 2Gi
          livenessProbe:
            exec:
              command: [sh, -c, "celery -A app.workers.celery_app inspect ping -d celery@$HOSTNAME"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
---
# Exactly one beat: it schedules agent.expire_approvals. Recreate, so a rollout never runs two at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: beat
  template:
    metadata:
      labels:
        app: beat
    spec:
      serviceAccountName: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: beat
          image: agentfastapi-app
          command: [celery, -A, app.workers.celery_app, beat, --loglevel=INFO, --schedule, /tmp/celerybeat-schedule]
          envFrom:
            - secretRef:
                name: agentfastapi-secrets
            - configMapRef:
                name: agentfastapi-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
