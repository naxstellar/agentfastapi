# The GCE load balancer terminates TLS with a Google-managed certificate on a reserved global static IP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: agentfastapi-dev-ip
    networking.gke.io/managed-certificates: api-cert
    networking.gke.io/v1beta1.FrontendConfig: api
spec:
  defaultBackend:
    service:
      name: api
      port:
        number: 8000
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: api-cert
spec:
  domains:
    - dev.example.com
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: api
spec:
  redirectToHttps:
    enabled: true
---
# timeoutSec: the default 30 s would cut SSE streams (runs last minutes). The health check hits the process only.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: api
spec:
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 60
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: 8000
