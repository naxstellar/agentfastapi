# Syncs Secret Manager into the Secret that the pods read with envFrom (same name as in local mode).
# Needs External Secrets Operator and a ClusterSecretStore named gcp-secret-manager (WP12 T12.11).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agentfastapi-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: agentfastapi-secrets
  data:
    - {secretKey: AUTH0_CLIENT_ID, remoteRef: {key: auth0-client-id}}
    - {secretKey: AUTH0_CLIENT_SECRET, remoteRef: {key: auth0-client-secret}}
    - {secretKey: SESSION_SECRET_KEY, remoteRef: {key: session-secret-key}}
    - {secretKey: ANTHROPIC_API_KEY, remoteRef: {key: anthropic-api-key}}
    - {secretKey: OPENAI_API_KEY, remoteRef: {key: openai-api-key}}
    - {secretKey: DATABASE_URL, remoteRef: {key: database-url}}
    - {secretKey: REDIS_URL, remoteRef: {key: redis-url}}
