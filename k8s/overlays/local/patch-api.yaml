apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          command:
            - uvicorn
            - app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --proxy-headers
            - --ssl-certfile
            - /app/certs-tls/tls.crt
            - --ssl-keyfile
            - /app/certs-tls/tls.key
          readinessProbe:
            httpGet:
              scheme: HTTPS
          livenessProbe:
            httpGet:
              scheme: HTTPS
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: gcp-adc
              mountPath: /var/run/gcp
              readOnly: true
            - name: tls
              mountPath: /app/certs-tls
              readOnly: true
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/gcp/adc.json
      volumes:
        - name: gcp-adc
          secret:
            secretName: agentfastapi-gcp-adc
            optional: true
        - name: tls
          secret:
            secretName: agentfastapi-tls
