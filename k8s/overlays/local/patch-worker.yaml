apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  template:
    spec:
      containers:
        - name: worker
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
          volumeMounts:
            - name: gcp-adc
              mountPath: /var/run/gcp
              readOnly: true
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/gcp/adc.json
      volumes:
        - name: gcp-adc
          secret:
            secretName: agentfastapi-gcp-adc
            optional: true
