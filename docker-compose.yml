services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    profiles: ["full"]
    # The image has no TLS of its own; local mode serves HTTPS with the mkcert certs mounted below.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--ssl-certfile", "certs/localhost+2.pem", "--ssl-keyfile", "certs/localhost+2-key.pem"]
    depends_on:
      - postgres
      - redis
    env_file:
      - env/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./certs:/app/certs:ro

  # Same image as api; no GCS/Agent Engine credentials inside a container (ADC lives on the laptop), so datasets
  # and run_python only work in the host-run worker (scripts/start.ps1).
  worker:
    build: .
    profiles: ["full"]
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--pool=threads", "--concurrency=4", "--loglevel=INFO"]
    depends_on:
      - postgres
      - redis
    env_file:
      - env/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0

  beat:
    build: .
    profiles: ["full"]
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      - redis
    env_file:
      - env/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0

volumes:
  pgdata:
